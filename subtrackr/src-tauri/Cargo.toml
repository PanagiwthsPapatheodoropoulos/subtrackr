[package]
name    = "subtrackr"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "shell-open",
  "window-close",
  "window-hide",
  "window-show",
  "window-maximize",
  "window-minimize",
  "window-unmaximize",
  "window-unminimize",
  "window-start-dragging",
  "notification-all",
  "clipboard-all"
] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[features]
# Enables custom protocol for the file:// scheme in prod builds
custom-protocol = ["tauri/custom-protocol"]
