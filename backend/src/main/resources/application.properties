spring.main.lazy-initialization=true

spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.config.import=optional:dotenv:.env


server.port=${PORT:8080}
spring.application.name=subtrackr

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# HikariCP ? PgBouncer transaction pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Scraper
app.scraper.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
app.scraper.timeout=${SCRAPER_TIMEOUT}

# Freemium limits
app.freemium.max-subscriptions=${FREEMIUM_MAX_SUBSCRIPTIONS}
app.freemium.max-trackers=${FREEMIUM_MAX_TRACKERS}

# Mail (Brevo)
app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}
app.brevo.api-key=${BREVO_API_KEY}

app.frontend-url=${FRONTEND_URL}

# Google OAuth
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}

# Groq
groq.api-key=${GROQ_API_KEY}

# Logging
logging.level.app.subtrackr=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never